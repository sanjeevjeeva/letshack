<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>VoltWay Layout</title>

<link href="https://fonts.googleapis.com/css2?family=Broadway:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    font-family: 'Broadway', sans-serif;
    margin:0;
}

/* HEADER */
.header{
    background:#0000FF ;
    padding:20px;
    text-align:center;
    font-size:24px;
}

/* MAIN SECTION */
.container{
    display:flex;
    padding:10px;
}

/* LEFT NAVIGATION */
.navbar{
    background:#0000FF ;
    width:20%;
    padding:20px;
}

/* CENTER CONTENT */
.content{
    background:#0000FF ;
    width:60%;
    padding:20px;
    margin:0 10px;
}

/* RIGHT SIDE */
.links{
    background:#0000FF ;
    width:20%;
    padding:20px;
}

/* FOOTER */
.footer{
    background:#0000FF ;
    text-align:center;
    padding:20px;
    margin-top:10px;
}

a{
    display:block;
    margin:10px 0;
    color:black;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
Header
</div>

<div class="container">

<div class="navbar">
<h3>Navigation Bar</h3>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="contact.html">Contact</a>
</div>

<div class="content">
<h2>Page Content</h2>
<p>
This is the main content area of the VoltWay website.
You can add text, images, videos, or information about
EV charging stations here.
</p>
</div>

<div class="links">
<h3>Additional Links</h3>
<a href="#">Charging Map</a>
<a href="#">Pricing</a>
<a href="#">Locations</a>
<a href="#">Support</a>
</div>

</div>

<div class="footer">
Footer
</div>

</body>
</html>
